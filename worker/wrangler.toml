name = "sur9e-waitlist"
main = "src/index.ts"
compatibility_date = "2026-05-12"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "sur9e.com/api/*", zone_name = "sur9e.com" }
]

# Hyperdrive binding for Railway Postgres. Create the Hyperdrive config in
# the CF dashboard with the Railway connection string, then paste the ID below.
[[hyperdrive]]
binding = "WAITLIST_DB"
id = "7f7ee25dee9f495a8cc3ab327e4625ce"

[vars]
CONFIRM_BASE_URL = "https://sur9e.com"

# Secrets — set via `wrangler secret put NAME` (do NOT commit values):
#   RESEND_API_KEY  — Resend API key, "Sending access" restricted to sur9e.com
#   CONFIRM_SECRET  — 32+ random hex chars, used to HMAC-sign confirmation tokens
